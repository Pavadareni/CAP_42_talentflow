spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_allocation_db
    username: "allocation_user"
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  integration:
    python-token: ${PYTHON_SERVICE_TOKEN}

